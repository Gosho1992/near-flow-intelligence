name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: make data
      - run: make test
      - run: git diff --exit-code data/out README.md THESIS.md METHOD.md   # outputs must match the committed ones
