name: daily-refresh
on:
  schedule: [{cron: "7 1 * * *"}]   # 01:07 UTC
  workflow_dispatch: {}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: daily, cancel-in-progress: false}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: make refresh
      - run: make test            # nothing is published if a check fails
      - name: commit refreshed data
        run: |
          git config user.name "nfi-bot"; git config user.email "nfi-bot@users.noreply.github.com"
          git add data README.md THESIS.md METHOD.md
          git commit -m "daily refresh $(date -u +%F)" || echo "no changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
        continue-on-error: true   # Pages may not be enabled yet; the data commit above still happens
